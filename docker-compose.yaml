services:
  underwriting-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: "."
      dockerfile: Dockerfile
      target: "development"
      args:
        - GRADLE_BASE_IMAGE=gradle:8.5-jdk17
        - JAVA_BASE_IMAGE=openjdk:17-jre-slim
    ports:
      - "8080:8080"  # Application port
      - "8081:8081"  # Debug port
    healthcheck:
      test: "curl --fail --silent localhost:8080/api/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - postgres
      - experian-mock
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-underwriting}
      - POSTGRES_USERNAME=underwriting_user
      - POSTGRES_PASSWORD=test123
      - SPRING_PROFILES_ACTIVE=compose
      - EXPERIAN_BASE_URL=http://experian-mock:9090
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  postgres:
    image: postgres:14.4-alpine3.16
    command: postgres -c 'max_connections=200'
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "underwriting", "-U", "underwriting_user"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=underwriting
      - POSTGRES_USER=underwriting_user
      - POSTGRES_PASSWORD=test123
    volumes:
      - "${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  experian-mock:
    image: wiremock/wiremock:3.3.1
    container_name: experian-mock
    ports:
      - "8089:9090"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    command: ["--verbose", "--global-response-templating", "--port", "9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/__admin"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
