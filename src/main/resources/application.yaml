# Tomcat Config
server:
  port: 8080
  servlet:
    context-path: '/api'

# Spring Config
spring:
  banner:
    location: 'classpath:banner.txt'
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 2
    type: com.zaxxer.hikari.HikariDataSource
  jmx:
    enabled: false
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        enable_lazy_load_no_trans: true
        temp:
          use_jdbc_metadata_defaults: false
  mvc:
    pathmatch:
      matching-strategy: 'ant_path_matcher'
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  output:
    ansi:
      enabled: detect

